<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASK Kanjoli Token Booking</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f3f6fb;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:22px 15px;
    text-align:center;
    border-radius:0 0 18px 18px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:7px 0 0;
}

.card{
    background:white;
    margin-top:15px;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-top:13px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:10px;
    background:#0d47a1;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.general{
    background:#fff8e1;
    border:2px solid #ffb300;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.general h3{
    margin:0 0 8px;
    color:#e65100;
}

.tokenBox{
    display:none;
    text-align:center;
    background:#e8f5e9;
    border:2px solid #2e7d32;
    padding:20px;
    margin-top:20px;
    border-radius:15px;
}

.token{
    font-size:48px;
    font-weight:bold;
    color:#1b5e20;
    margin:10px;
}

.success{
    color:#1b5e20;
    font-weight:bold;
}

.error{
    color:#c62828;
    font-weight:bold;
    white-space:pre-wrap;
}

.small{
    font-size:13px;
    color:#666;
}

.printBtn{
    background:#2e7d32;
}

.clearBtn{
    background:#757575;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h1>ASK Kanjoli</h1>
    <p>Token Booking System</p>
</div>

<div class="container">

<div class="card">

    <h2>Token Booking</h2>

    <div id="firebaseStatus" class="status">
        Firebase connect हो रहा है...
    </div>

    <label>नाम</label>
    <input id="name" type="text" placeholder="अपना नाम लिखें">

    <label>उम्र</label>
    <input id="age" type="number" placeholder="उम्र">

    <label>लिंग</label>
    <select id="gender">
        <option value="">चुनें</option>
        <option value="Male">पुरुष</option>
        <option value="Female">महिला</option>
        <option value="Other">अन्य</option>
    </select>

    <label>पता</label>
    <input id="address" type="text" placeholder="पूरा पता">

    <label>Service</label>
    <select id="service">
        <option value="General">General</option>
        <option value="New Aadhaar">New Aadhaar</option>
        <option value="Aadhaar Update">Aadhaar Update</option>
        <option value="Mobile Update">Mobile Update</option>
        <option value="Other">Other</option>
    </select>

    <div class="general">
        <h3>General Token</h3>
        <div>
            आज के General Token:
            <b id="generalCount">लोड हो रहा है...</b>
        </div>
        <div class="small">
            अधिकतम 40 Token प्रतिदिन
        </div>
    </div>

    <button id="bookBtn" onclick="bookToken()">
        Token Book करें
    </button>

    <div id="message"></div>

    <div id="tokenBox" class="tokenBox">

        <div class="success">
            आपका Token सफलतापूर्वक Book हो गया
        </div>

        <div class="token" id="tokenNumber">
            A-001
        </div>

        <div>
            Reporting Time:
            <b id="reportingTime"></b>
        </div>

        <p id="bookingDetails"></p>

        <button class="printBtn" onclick="window.print()">
            Print / Download Slip
        </button>

        <button class="clearBtn" onclick="location.reload()">
            नया Token
        </button>

    </div>

</div>

</div>


<!-- Firebase -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    addDoc,
    collection,
    runTransaction,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   YOUR FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCKs8CbP8s7QGG8fu3R-k-gIQR",
    
    authDomain:
    "ask-kanjoli-token-booking.firebaseapp.com",

    projectId:
    "ask-kanjoli-token-booking",

    storageBucket:
    "ask-kanjoli-token-booking.firebasestorage.app",

    messagingSenderId:
    "469671905701",

    appId:
    "1:469671905701:web:1c42ff1c96a5a6b728804c"
};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

let currentUser = null;


/* =========================================
   DATE
========================================= */

function getToday(){

    const d = new Date();

    const year = d.getFullYear();

    const month =
        String(d.getMonth()+1).padStart(2,"0");

    const day =
        String(d.getDate()).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


/* =========================================
   REPORTING TIME
   हर Token को 15 मिनट का slot
========================================= */

function getReportingTime(tokenNumber){

    const baseHour = 9;

    const baseMinute = 0;

    const minutes =
        baseMinute + ((tokenNumber - 1) * 15);

    const hour =
        baseHour + Math.floor(minutes / 60);

    const minute =
        minutes % 60;

    const h =
        String(hour).padStart(2,"0");

    const m =
        String(minute).padStart(2,"0");

    return `${h}:${m}`;
}


/* =========================================
   FIREBASE LOGIN
========================================= */

async function loginFirebase(){

    try{

        await signInAnonymously(auth);

        document.getElementById("firebaseStatus").innerHTML =
            "🟢 Firebase Connected";

        document.getElementById("firebaseStatus").style.color =
            "green";

        await loadGeneralCount();

    }
    catch(error){

        console.error(error);

        document.getElementById("firebaseStatus").innerHTML =
            "🔴 Firebase Connection Error";

        document.getElementById("firebaseStatus").style.color =
            "red";

        showError(
            "Firebase login नहीं हो पाया.\n\n" +
            "Authentication → Sign-in method → Anonymous को Enable करें."
        );
    }
}


onAuthStateChanged(auth, user => {

    if(user){

        currentUser = user;

        loadGeneralCount();

    }

});


/* =========================================
   LOAD TOKEN COUNT
========================================= */

async function loadGeneralCount(){

    if(!currentUser) return;

    try{

        const today = getToday();

        const counterRef =
            doc(db,"counters",today);

        const snap =
            await getDoc(counterRef);

        let count = 0;

        if(snap.exists()){

            count = snap.data().general || 0;

        }

        document.getElementById("generalCount")
            .innerText =
            `${count} / 40`;

    }
    catch(error){

        console.error(error);

        document.getElementById("generalCount")
            .innerText =
            "Error";

    }
}


/* =========================================
   BOOK TOKEN
========================================= */

window.bookToken = async function(){

    const button =
        document.getElementById("bookBtn");

    const name =
        document.getElementById("name").value.trim();

    const age =
        document.getElementById("age").value.trim();

    const gender =
        document.getElementById("gender").value;

    const address =
        document.getElementById("address").value.trim();

    const service =
        document.getElementById("service").value;


    /* Validation */

    if(!currentUser){

        showError(
            "Firebase अभी connected नहीं है."
        );

        return;
    }


    if(!name){

        showError("नाम भरना जरूरी है.");

        return;
    }


    if(!age){

        showError("उम्र भरना जरूरी है.");

        return;
    }


    if(!gender){

        showError("लिंग चुनें.");

        return;
    }


    if(!address){

        showError("पता भरना जरूरी है.");

        return;
    }


    button.disabled = true;

    button.innerText =
        "Token बनाया जा रहा है...";


    try{

        const today = getToday();

        const counterRef =
            doc(db,"counters",today);


        /*
          Transaction के अंदर token count
          सुरक्षित तरीके से बढ़ाया जाएगा
        */

        const tokenNumber =
            await runTransaction(
                db,
                async transaction => {

                    const counterSnap =
                        await transaction.get(counterRef);

                    let currentCount = 0;

                    if(counterSnap.exists()){

                        currentCount =
                            counterSnap.data().general || 0;

                    }


                    /* Maximum 40 */

                    if(currentCount >= 40){

                        throw new Error(
                            "TODAY_FULL"
                        );

                    }


                    const nextNumber =
                        currentCount + 1;


                    transaction.set(
                        counterRef,
                        {
                            general: nextNumber,
                            date: today,
                            updatedAt:
                                serverTimestamp()
                        },
                        {
                            merge:true
                        }
                    );


                    return nextNumber;

                }
            );


        /* Token */

        const token =
            "A-" +
            String(tokenNumber)
            .padStart(3,"0");


        /* Reporting Time */

        const reportingTime =
            getReportingTime(tokenNumber);


        /* Save Booking */

        await addDoc(
            collection(db,"Booking"),
            {

                token: token,

                tokenNumber:
                    tokenNumber,

                date: today,

                name: name,

                age: age,

                gender: gender,

                address: address,

                service: service,

                reportingTime:
                    reportingTime,

                uid:
                    currentUser.uid,

                createdAt:
                    serverTimestamp()

            }
        );


        /* Show result */

        document.getElementById(
            "tokenNumber"
        ).innerText = token;


        document.getElementById(
            "reportingTime"
        ).innerText =
            reportingTime;


        document.getElementById(
            "bookingDetails"
        ).innerHTML =

            `<b>नाम:</b> ${escapeHtml(name)}<br>
             <b>उम्र:</b> ${escapeHtml(age)}<br>
             <b>Service:</b> ${escapeHtml(service)}<br>
             <b>दिनांक:</b> ${today}`;


        document.getElementById(
            "tokenBox"
        ).style.display =
            "block";


        document.getElementById(
            "message"
        ).innerHTML = "";


        await loadGeneralCount();


        button.style.display =
            "none";

    }
    catch(error){

        console.error(error);

        if(error.message === "TODAY_FULL"){

            showError(
                "आज के सभी 40 General Token भर चुके हैं."
            );

        }
        else{

            showError(
                "Token Booking में समस्या हुई.\n\n" +
                error.message
            );

        }

        button.disabled = false;

        button.innerText =
            "Token Book करें";
    }

};


/* =========================================
   ERROR
========================================= */

function showError(text){

    document.getElementById("message")
        .innerHTML =
        `<p class="error">${escapeHtml(text)}</p>`;
}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================
   START
========================================= */

loginFirebase();

</script>

</body>
</html>
