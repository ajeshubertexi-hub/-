<!DOCTYPE html>
<html lang="hi">
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>आधार सेवा केन्द्र कंजौली</title>
</head>
<script src="script.js"></script>
<body>

<h1>आधार सेवा केन्द्र कंजौली</h1>

<h3>Online Token Booking System</h3>

<p>
आईटी केंद्र कंजौली<br>
तहसील - बालघाट, जिला - करौली (राजस्थान)
</p>

<p>
समय: 8:00 AM से 5:00 PM<br>
मोबाइल: 8426971575
</p>

<hr>

<h2>टोकन बुक करें</h2>

<form>

<label>ग्राहक का नाम:</label><br>
<input type="text" placeholder="अपना नाम लिखें"><br><br>

<label>सेवा चुनें:</label><br>
<select id="service">

<select>
<option>नया नामांकन (0-5 वर्ष)</option>
<option>नया नामांकन (5-18 वर्ष)</option>
<option>नाम अपडेट</option>
<option>जन्म तिथि अपडेट</option>
<option>मोबाइल नंबर अपडेट</option>
<option>ईमेल अपडेट</option>
<option>पता अपडेट</option>
<option>बायोमेट्रिक अपडेट</option>
</select>

<br><br>

<label>समय स्लॉट चुनें:</label><br>

<select id="timeSlot">

<option>8:00 AM - 8:30 AM</option>
<option>8:30 AM - 9:00 AM</option>
<option>9:00 AM - 9:30 AM</option>
<option>9:30 AM - 10:00 AM</option>
<option>10:00 AM - 10:30 AM</option>
<option>10:30 AM - 11:00 AM</option>
<option>11:00 AM - 11:30 AM</option>
<option>11:30 AM - 12:00 PM</option>
<option>12:00 PM - 12:30 PM</option>
<option>12:30 PM - 1:00 PM</option>
<option>1:00 PM - 1:30 PM</option>
<option>1:30 PM - 2:00 PM</option>
<option>2:00 PM - 2:30 PM</option>
<option>2:30 PM - 3:00 PM</option>
<option>3:00 PM - 3:30 PM</option>
<option>3:30 PM - 4:00 PM</option>
<option>4:00 PM - 4:30 PM</option>
<option>4:30 PM - 5:00 PM</option>

</select>

<br><br>

<button type="button" onclick="bookToken()">
टोकन बुक करें
</button>
<div id="tokenSlip" style="display:none;">
<h2>आधार सेवा केन्द्र कंजौली</h2>
<h3>आपका टोकन</h3>

<p id="tokenNumber"></p>
<p id="customerName"></p>
<p id="customerService"></p>

<p>कृपया अपने समय पर केन्द्र पर आएं।</p>
</div>
</form>

</body>
</html>
