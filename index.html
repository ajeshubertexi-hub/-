<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>आधार सेवा केन्द्र कंजौली</title>
</head>

<body>

<h1>आधार सेवा केन्द्र कंजौली</h1>

<h3>Online Token Booking System</h3>

<p>
आईटी केंद्र कंजौली<br>
तहसील - बालघाट, जिला - करौली (राजस्थान)
</p>

<p>
समय: 8:00 AM से 5:00 PM<br>
मोबाइल: 8426971575
</p>

<hr>

<h2>टोकन बुक करें</h2>

<form>

<label>ग्राहक का नाम:</label><br>
<input type="text" placeholder="अपना नाम लिखें"><br><br>

<label>सेवा चुनें:</label><br>

<select>
<option>नया नामांकन (0-5 वर्ष)</option>
<option>नया नामांकन (5-18 वर्ष)</option>
<option>नाम अपडेट</option>
<option>जन्म तिथि अपडेट</option>
<option>मोबाइल नंबर अपडेट</option>
<option>ईमेल अपडेट</option>
<option>पता अपडेट</option>
<option>बायोमेट्रिक अपडेट</option>
</select>

<br><br>

<label>समय स्लॉट:</label><br>

<select>
<option>9:00 AM - 10:00 AM</option>
<option>10:00 AM - 11:00 AM</option>
<option>11:00 AM - 12:00 PM</option>
<option>12:00 PM - 1:00 PM</option>
</select>

<br><br>

<button type="button">
टोकन बुक करें
</button>

</form>

</body>
</html>
