<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASK Kanjoli Token Booking</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    padding:22px 15px;
    text-align:center;
    border-radius:0 0 18px 18px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    margin-top:15px;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:13px;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:10px;
    background:#0d47a1;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

.status{
    text-align:center;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    font-size:14px;
    background:#f5f5f5;
}

.general{
    background:#fff8e1;
    border:2px solid #ffb300;
    padding:15px;
    border-radius:12px;
    margin-top:18px;
}

.general h3{
    margin:0 0 8px;
    color:#e65100;
}

.small{
    font-size:13px;
    color:#666;
    margin-top:5px;
}

.message{
    margin-top:12px;
}

.error{
    color:#c62828;
    font-weight:bold;
    white-space:pre-wrap;
    line-height:1.5;
}

.success{
    color:#1b5e20;
    font-weight:bold;
}

.tokenBox{
    display:none;
    text-align:center;
    background:#e8f5e9;
    border:2px solid #2e7d32;
    padding:20px;
    margin-top:20px;
    border-radius:15px;
}

.token{
    font-size:52px;
    font-weight:bold;
    color:#1b5e20;
    margin:15px;
}

.printBtn{
    background:#2e7d32;
}

.newBtn{
    background:#757575;
}

.slip{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    text-align:left;
    border:1px solid #ddd;
}

.loading{
    opacity:.7;
}

@media print{

    body{
        background:white;
    }

    .header,
    .card > h2,
    #firebaseStatus,
    form,
    .general,
    #bookBtn,
    .message,
    .newBtn,
    .printBtn{
        display:none !important;
    }

    .container{
        max-width:100%;
        padding:0;
    }

    .card{
        box-shadow:none;
        margin:0;
    }

    .tokenBox{
        display:block !important;
        border:2px solid #000;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>ASK Kanjoli</h1>

    <p>Token Booking System</p>

</div>


<div class="container">

<div class="card">

<h2>Token Booking</h2>


<div id="firebaseStatus" class="status">
    Firebase connect हो रहा है...
</div>


<form id="bookingForm">

<label>नाम</label>

<input
    id="name"
    type="text"
    placeholder="अपना नाम लिखें"
    autocomplete="name"
    required
>


<label>उम्र</label>

<input
    id="age"
    type="number"
    min="1"
    max="120"
    placeholder="उम्र"
    required
>


<label>लिंग</label>

<select id="gender" required>

    <option value="">
        चुनें
    </option>

    <option value="Male">
        पुरुष
    </option>

    <option value="Female">
        महिला
    </option>

    <option value="Other">
        अन्य
    </option>

</select>


<label>पता</label>

<input
    id="address"
    type="text"
    placeholder="पूरा पता"
    required
>


<label>Service</label>

<select id="service">

    <option value="General">
        General
    </option>

    <option value="New Aadhaar">
        New Aadhaar
    </option>

    <option value="Aadhaar Update">
        Aadhaar Update
    </option>

    <option value="Mobile Update">
        Mobile Update
    </option>

    <option value="Other">
        Other
    </option>

</select>


<div class="general">

    <h3>General Token</h3>

    <div>
        आज के General Token:
        <b id="generalCount">लोड हो रहा है...</b>
    </div>

    <div class="small">
        अधिकतम 40 Token प्रतिदिन
    </div>

</div>


<button
    id="bookBtn"
    type="submit"
>
    Token Book करें
</button>

</form>


<div
    id="message"
    class="message"
></div>


<div
    id="tokenBox"
    class="tokenBox"
>

    <div class="success">
        आपका Token सफलतापूर्वक Book हो गया
    </div>


    <div
        id="tokenNumber"
        class="token"
    >
        A-001
    </div>


    <div>

        Reporting Time:
        <b id="reportingTime"></b>

    </div>


    <div
        id="bookingDetails"
        class="slip"
    ></div>


    <button
        class="printBtn"
        onclick="window.print()"
    >
        Print / Download Slip
    </button>


    <button
        class="newBtn"
        onclick="location.reload()"
    >
        नया Token
    </button>

</div>

</div>

</div>


<script type="module">


/* =========================================
   FIREBASE IMPORT
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    runTransaction,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyCKs8CbP8s7QGG8fu3R-k-gIQR",

    authDomain:
    "ask-kanjoli-token-booking.firebaseapp.com",

    projectId:
    "ask-kanjoli-token-booking",

    storageBucket:
    "ask-kanjoli-token-booking.firebasestorage.app",

    messagingSenderId:
    "469671905701",

    appId:
    "1:469671905701:web:1c42ff1c96a5a6b728804c"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let currentUser = null;


/* =========================================
   ELEMENTS
========================================= */

const statusBox =
    document.getElementById(
        "firebaseStatus"
    );

const countBox =
    document.getElementById(
        "generalCount"
    );

const bookBtn =
    document.getElementById(
        "bookBtn"
    );

const messageBox =
    document.getElementById(
        "message"
    );


/* =========================================
   TODAY
========================================= */

function getToday(){

    const d =
        new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================
   REPORTING TIME
   TOKEN 1 = 09:00
   TOKEN 2 = 09:15
========================================= */

function getReportingTime(number){

    const totalMinutes =
        9 * 60 +
        ((number - 1) * 15);

    const hour =
        Math.floor(
            totalMinutes / 60
        );

    const minute =
        totalMinutes % 60;

    return (
        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0")
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(text){

    messageBox.innerHTML =
        `<div class="error">${escapeHtml(text)}</div>`;

}


/* =========================================
   LOAD COUNT
========================================= */

async function loadGeneralCount(){

    if(!currentUser){

        return;
    }


    try{

        const today =
            getToday();

        const counterRef =
            doc(
                db,
                "counters",
                today
            );


        const snap =
            await getDoc(
                counterRef
            );


        let count = 0;


        if(snap.exists()){

            count =
                Number(
                    snap.data().general || 0
                );

        }


        countBox.innerText =
            count + " / 40";


    }
    catch(error){

        console.error(
            "COUNT ERROR:",
            error
        );

        countBox.innerText =
            "लोड नहीं हुआ";

    }

}


/* =========================================
   LOGIN
========================================= */

async function loginFirebase(){

    try{

        statusBox.innerText =
            "Firebase login हो रहा है...";

        statusBox.style.color =
            "#555";


        await signInAnonymously(
            auth
        );


    }
    catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );


        statusBox.innerText =
            "🔴 Firebase Login Error";


        statusBox.style.color =
            "red";


        showError(

            "Firebase Login नहीं हो पाया.\n\n" +

            "Firebase Console में जाएँ:\n" +

            "Authentication → Sign-in method → Anonymous → Enable\n\n" +

            "अगर Anonymous पहले से Enable है तो Firebase Console में आपका Web App सही Project से जुड़ा है या नहीं जाँचें.\n\n" +

            "Error: " +
            error.message

        );

    }

}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(user){

            currentUser =
                user;


            statusBox.innerText =
                "🟢 Firebase Connected";


            statusBox.style.color =
                "green";


            await loadGeneralCount();

        }

    }
);


/* =========================================
   BOOKING
========================================= */

document
.getElementById("bookingForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        messageBox.innerHTML =
            "";


        if(!currentUser){

            showError(
                "Firebase अभी connected नहीं है."
            );

            return;

        }


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const age =
            document
            .getElementById("age")
            .value
            .trim();


        const gender =
            document
            .getElementById("gender")
            .value;


        const address =
            document
            .getElementById("address")
            .value
            .trim();


        const service =
            document
            .getElementById("service")
            .value;


        if(!name){

            showError(
                "नाम भरना जरूरी है."
            );

            return;

        }


        if(!age){

            showError(
                "उम्र भरना जरूरी है."
            );

            return;

        }


        if(
            Number(age) < 1 ||
            Number(age) > 120
        ){

            showError(
                "उम्र 1 से 120 के बीच होनी चाहिए."
            );

            return;

        }


        if(!gender){

            showError(
                "लिंग चुनना जरूरी है."
            );

            return;

        }


        if(!address){

            showError(
                "पता भरना जरूरी है."
            );

            return;

        }


        bookBtn.disabled =
            true;

        bookBtn.innerText =
            "Token बनाया जा रहा है...";


        try{

            const today =
                getToday();


            const counterRef =
                doc(
                    db,
                    "counters",
                    today
                );


            /*
             * नया Booking document पहले बनाया जाता है
             * ताकि transaction के अंदर ही save हो सके।
             */

            const bookingRef =
                doc(
                    collection(
                        db,
                        "Booking"
                    )
                );


            const tokenNumber =
                await runTransaction(
                    db,
                    async transaction => {

                        const counterSnap =
                            await transaction.get(
                                counterRef
                            );


                        let currentCount = 0;


                        if(
                            counterSnap.exists()
                        ){

                            currentCount =
                                Number(
                                    counterSnap
                                    .data()
                                    .general || 0
                                );

                        }


                        if(
                            currentCount >= 40
                        ){

                            throw new Error(
                                "TODAY_FULL"
                            );

                        }


                        const nextNumber =
                            currentCount + 1;


                        const token =
                            "A-" +
                            String(
                                nextNumber
                            ).padStart(
                                3,
                                "0"
                            );


                        const reportingTime =
                            getReportingTime(
                                nextNumber
                            );


                        /*
                         * Counter update
                         */

                        transaction.set(

                            counterRef,

                            {

                                general:
                                    nextNumber,

                                date:
                                    today,

                                updatedAt:
                                    serverTimestamp()

                            },

                            {
                                merge:true
                            }

                        );


                        /*
                         * Booking save
                         */

                        transaction.set(

                            bookingRef,

                            {

                                token:
                                    token,

                                tokenNumber:
                                    nextNumber,

                                date:
                                    today,

                                name:
                                    name,

                                age:
                                    age,

                                gender:
                                    gender,

                                address:
                                    address,

                                service:
                                    service,

                                reportingTime:
                                    reportingTime,

                                uid:
                                    currentUser.uid

                            }

                        );


                        return nextNumber;

                    }
                );


            const token =
                "A-" +
                String(
                    tokenNumber
                ).padStart(
                    3,
                    "0"
                );


            const reportingTime =
                getReportingTime(
                    tokenNumber
                );


            /*
             * Result show
             */

            document
            .getElementById(
                "tokenNumber"
            )
            .innerText =
                token;


            document
            .getElementById(
                "reportingTime"
            )
            .innerText =
                reportingTime;


            document
            .getElementById(
                "bookingDetails"
            )
            .innerHTML =

                "<b>नाम:</b> " +
                escapeHtml(name) +

                "<br><b>उम्र:</b> " +
                escapeHtml(age) +

                "<br><b>लिंग:</b> " +
                escapeHtml(gender) +

                "<br><b>पता:</b> " +
                escapeHtml(address) +

                "<br><b>Service:</b> " +
                escapeHtml(service) +

                "<br><b>दिनांक:</b> " +
                escapeHtml(today);


            document
            .getElementById(
                "tokenBox"
            )
            .style.display =
                "block";


            messageBox.innerHTML =
                "";


            await loadGeneralCount();


            bookBtn.style.display =
                "none";


        }
        catch(error){

            console.error(
                "BOOKING ERROR:",
                error
            );


            if(
                error.message ===
                "TODAY_FULL"
            ){

                showError(
                    "आज के सभी 40 General Token भर चुके हैं."
                );

            }
            else if(
                error.code ===
                "permission-denied"
            ){

                showError(

                    "Firebase Permission Denied.\n\n" +

                    "Firestore → Rules में नया Rules Code Publish करें."

                );

            }
            else{

                showError(

                    "Token Booking नहीं हुई.\n\n" +

                    "Error: " +
                    error.message

                );

            }


            bookBtn.disabled =
                false;

            bookBtn.innerText =
                "Token Book करें";

        }

    }
);


/* =========================================
   START
========================================= */

loginFirebase();

</script>

</body>
</html>
